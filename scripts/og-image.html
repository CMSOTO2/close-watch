<!doctype html>
<meta charset="utf-8" />
<title>Closewatch social card</title>
<!--
  The source for public/og.png. Rendered by scripts/generate-og-image.py, not
  opened by anyone: it is a 1200x630 page that exists to be photographed.

  It uses the real webfonts and the palette out of src/styles.css so the card
  matches the page it links to. Keep the two in step by hand; a card in last
  season's brass is worse than no card.
-->
<!-- The faces are embedded, not fetched: headless Chrome photographs this page
     the moment it paints, and a card whose fonts were still in flight comes out
     with no words on it. See scripts/fetch-og-fonts.py. -->
<link rel="stylesheet" href="og-fonts.css" />
<style>

  /* The dark palette from src/styles.css. Dark on purpose: a feed is mostly
     white cards, and this one stops the scroll by not being one. */
  :root {
    --canvas: #131211;
    --surface: #1a1917;
    --surface-2: #211f1c;
    --ink: #f0ede7;
    --ink-2: #a39c90;
    --ink-3: #746e65;
    --line: #2d2a25;
    --brand: #dfa954;
    --brand-soft: #2a2318;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 44px;
    padding: 72px 76px;
    background: var(--canvas);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 46px; height: 46px; }
  .brand span {
    font-family: 'Instrument Sans', 'Inter', sans-serif;
    font-weight: 600;
    font-size: 32px;
    letter-spacing: -0.02em;
  }

  .body { display: flex; align-items: flex-end; justify-content: space-between; gap: 56px; }

  /* Three lines, no orphan. `balance` keeps it that way if the words ever
     change; the width is what stops "read it." landing on a line of its own. */
  h1 {
    max-width: 13ch;
    text-wrap: balance;
    font-family: 'Instrument Sans', 'Inter', sans-serif;
    font-weight: 600;
    font-size: 74px;
    line-height: 1.02;
    letter-spacing: -0.035em;
  }

  /* The card is read at thumbnail size more often than not, so the subline
     carries the three nouns and nothing else. Full sentences vanish. */
  .sub {
    margin-top: 26px;
    max-width: 30ch;
    font-size: 26px;
    font-weight: 450;
    line-height: 1.45;
    color: var(--ink-2);
  }

  /* A fragment of the report rather than a screenshot of it: at 300px wide a
     real screenshot is grey mush, and this still reads as the product. */
  .report {
    flex: 0 0 366px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    padding: 26px 28px 28px;
  }
  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brand);
  }
  /* The deal's value, which is the argument for the price without making it.
     Nobody weighs $19 a month against an $18,000 deal for long. */
  .value {
    margin-top: 10px;
    font-family: 'Instrument Sans', 'Inter', sans-serif;
    font-weight: 600;
    font-size: 58px;
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .heat {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 20px;
    font-weight: 500;
    color: var(--brand);
  }
  .heat b {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 17px;
    color: var(--ink-3);
    margin-left: auto;
  }
  /* Three rising bars, the same mark the dashboard uses for heat. */
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 17px; }
  .bars i { width: 5px; background: var(--brand); border-radius: 1px; }
  .bars i:nth-child(1) { height: 7px; }
  .bars i:nth-child(2) { height: 12px; }
  .bars i:nth-child(3) { height: 17px; }
  .rows {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .rows div {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 19px;
    color: var(--ink-2);
  }
  .rows i {
    flex: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--brand);
    transform: translateY(-3px);
  }

  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 21px;
    color: var(--ink-2);
  }
  .foot b {
    font-weight: 500;
    color: var(--brand);
    background: var(--brand-soft);
    border-radius: 6px;
    padding: 7px 12px;
    letter-spacing: 0.04em;
  }
</style>

<div class="brand">
  <!-- public/favicon.svg with the dark-mode pairing inlined: light tile, deep
       brass mark. A PNG cannot answer prefers-color-scheme, and the dark tile
       would all but vanish against this ground. -->
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="8.5" fill="#f0ede7" />
    <circle cx="16" cy="16" r="9" fill="none" stroke="#875809" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="44.3 12.25" />
    <circle cx="22.99" cy="10.34" r="2.7" fill="#875809" />
  </svg>
  <span>Closewatch</span>
</div>

<div class="body">
  <div>
    <h1>Stop guessing whether they read it.</h1>
    <p class="sub">Who opened it. How long they spent on your pricing. Who they forwarded it to.</p>
  </div>

  <div class="report">
    <p class="kicker">Northwind Studio</p>
    <p class="value">$18,000</p>
    <p class="heat">
      <span class="bars"><i></i><i></i><i></i></span>
      Hot <b>86 / 100</b>
    </p>
    <div class="rows">
      <div><i></i><span>Shared with 2 other people</span></div>
      <div><i></i><span>2m 14s on pricing</span></div>
      <div><i></i><span>Opened 4 times</span></div>
    </div>
  </div>
</div>

<div class="foot">
  <span>getclosewatch.com</span>
  <b>Free to start</b>
</div>
