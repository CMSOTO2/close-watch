# The end-to-end tests, kept off the per-push path on purpose.
#
# They cost roughly six billed minutes a run: installing browsers dominates,
# and the viewer test then waits out real seconds of reading because
# qualification needs three seconds of visible attention by design. On a private
# repo, running that on every push would cost more minutes per month than the
# free allowance holds, and it would mostly be re-proving that an upload form
# nobody touched still works.
#
# So it runs on demand, and once a week as a backstop. `pnpm test:e2e` locally is
# the copy that catches things while you are actually changing them.
#
# Every step is skipped until the repository secrets exist, because these tests
# make real accounts in a real Supabase project and there is nothing useful they
# can do without one. The guard is repeated per step rather than written once on
# the job, because `secrets` is not a context a job-level `if` can read: the file
# is rejected as invalid before anything runs. `env` is readable from a step's
# `if`, so the secret is lifted into `env` above and each step asks that.
name: E2E

on:
  workflow_dispatch:
  schedule:
    # Monday morning, so a week of small changes gets one honest check.
    - cron: '0 9 * * 1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      IP_HASH_SALT: ci-only-salt-not-a-secret
      VITE_PUBLIC_URL: http://localhost:3000
    steps:
      - name: Say why nothing ran
        if: env.SUPABASE_SECRET_KEY == ''
        run: |
          echo "::notice::Skipped. Add VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY and SUPABASE_SECRET_KEY under Settings, Secrets and variables, Actions."

      - uses: actions/checkout@v4
        if: env.SUPABASE_SECRET_KEY != ''

      - uses: pnpm/action-setup@v4
        if: env.SUPABASE_SECRET_KEY != ''
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: env.SUPABASE_SECRET_KEY != ''
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: env.SUPABASE_SECRET_KEY != ''

      # WebKit as well as Chromium: the mobile-safari project is the only place
      # the iPhone half of the traffic is actually exercised, and Playwright's
      # iPhone device is WebKit. Mobile Chrome rides on the Chromium build and
      # costs nothing extra.
      - run: pnpm exec playwright install --with-deps chromium webkit
        if: env.SUPABASE_SECRET_KEY != ''

      - run: pnpm test:e2e
        if: env.SUPABASE_SECRET_KEY != ''

      - uses: actions/upload-artifact@v4
        if: failure() && env.SUPABASE_SECRET_KEY != ''
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
