# Runs what `pnpm run deploy` does not: the checks, before the code is live.
#
# `wrangler deploy` publishes the working tree rather than a branch, so nothing
# between a broken change and production was automatic. This is that.
#
# The public env vars below are deliberate nonsense. `src/env.ts` validates them
# at module load, so the build needs values shaped right, and it needs nothing
# that works: no route rendered here talks to Supabase. Real keys in CI would be
# a secret leak with no upside.
name: CI

# Minutes are metered on a private repo, so a push that changes only prose does
# not buy a run. Roughly a quarter of the commits here are documentation alone.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      VITE_PUBLIC_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      # First, and before anything slow. A workflow file with a bad expression
      # is rejected by GitHub at parse time with no run and no failed check, so
      # the only signal is noticing the workflow quietly stopped existing. This
      # catches it here instead: `secrets` is not readable from a job-level
      # `if`, and that is exactly the mistake it caught the first time.
      - name: Lint workflow files
        run: |
          curl -sSLo actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      # Last because it is the slowest, and because a type or lint error is a
      # more useful thing to be told than a build that fell over for it.
      - run: pnpm build
